---
# cPanel Auto-Deployment Configuration
# Ganti 'username' dengan username cPanel Anda

deployment:
  tasks:
    - export DEPLOYPATH=/home/username/public_html/
    - /bin/cp -R .next $DEPLOYPATH
    - /bin/cp -R public $DEPLOYPATH
    - /bin/cp -R node_modules $DEPLOYPATH
    - /bin/cp package.json $DEPLOYPATH
    - /bin/cp server.js $DEPLOYPATH
    - /bin/cp ecosystem.config.js $DEPLOYPATH
    - /bin/cp .env.production $DEPLOYPATH/.env
    - /bin/cp .htaccess $DEPLOYPATH
